name: karipa
description: Karipa mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/branding/karipa-logo.png
    - assets/branding/karipa-wordmark.png

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.1
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  geolocator: ^14.1.1
  latlong2: ^0.10.1
  intl: ^0.20.3
  flutter_map: ^8.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
