version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: karipa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: karipa
      POSTGRES_USER: karipa_user
      POSTGRES_PASSWORD: karipa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
